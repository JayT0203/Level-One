name: Update jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # adds a "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node collector/collect.mjs
      - name: Save new jobs list
        run: |
          git config user.name "level-one-bot"
          git config user.email "level-one-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
