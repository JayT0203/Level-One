<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level One · Junior games jobs</title>
<meta name="description" content="Entry-level, graduate, intern and junior video game jobs in the UK and remote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f2f8; --surface:#ffffff; --fg:#1b1a2e; --muted:#5d5b78; --line:#dedcec;
  --accent:#3b3bd6; --accent-ink:#ffffff; --accent-soft:#e6e5fd;
  --coin:#b97b00; --coin-soft:#fdf1d6; --remote-soft:#daf3ea; --local-soft:#fde4dc;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13121f; --surface:#1d1c2e; --fg:#ecebf7; --muted:#a3a1c0; --line:#323049;
  --accent:#8c8cff; --accent-ink:#13121f; --accent-soft:#2a2a52;
  --coin:#f2b93b; --coin-soft:#3a2f14; --remote-soft:#163a31; --local-soft:#3d2219; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 10px}
.logo{font-family:var(--display);font-weight:700;font-size:28px;display:flex;align-items:center;gap:10px}
.logo .lvl{background:var(--accent);color:var(--accent-ink);padding:2px 8px;font-size:18px}
.tag{color:var(--muted);font-size:15px}

.hero{padding-block:8px 18px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:62ch}

.controls{background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);padding:8px 12px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
.seg{display:flex;flex-wrap:wrap;border:2px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select{border:2px solid var(--line);background:var(--bg);padding:8px 10px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 12px;cursor:pointer;font-size:14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}

.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;margin-top:18px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:minmax(0,1fr)}.detail{position:static!important}}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:8px}
.job{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);padding:12px;cursor:pointer}
.job:hover{border-color:var(--accent)}
.job[aria-current="true"]{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
.badge{width:44px;height:44px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff}
.job h3{margin:0;font-size:16px;line-height:1.3}
.job .studio{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-family:var(--mono);font-size:11.5px;padding:2px 7px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.remote{background:var(--remote-soft);border-color:transparent}
.pill.local{background:var(--local-soft);border-color:transparent}
.pill.lvl{background:var(--accent-soft);border-color:transparent}
.age{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.new{color:var(--coin);font-weight:600}
.star{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:4px}
.star[aria-pressed="true"]{color:var(--coin)}

.detail{position:sticky;top:max(12px,env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);padding:22px}
.detail h2{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;margin:12px 0 4px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:16px 0}
.facts div{background:var(--surface);padding:10px}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.detail h4{margin:18px 0 6px;font-size:15px}
.desc{margin:0;max-width:65ch}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line);padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.job{transition:border-color .12s,box-shadow .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="lvl">LV1</span>Level One</div>
    <div class="tag">Entry-level and junior jobs in games</div>
  </header>

  <section class="hero">
    <h1>Your first job in games starts here.</h1>
    <p>Only graduate, junior, trainee and intern roles. Senior jobs are filtered out, so everything here is open to people starting out. <span id="total"></span></p>
  </section>

  <section class="controls" aria-label="Search and filters">
    <div class="row">
      <label class="search" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search job title, studio or town">
      </label>
      <div class="seg" role="group" aria-label="Where">
        <button type="button" data-where="all" aria-pressed="true">All</button>
        <button type="button" data-where="uk" aria-pressed="false">UK</button>
        <button type="button" data-where="em" aria-pressed="false">East Midlands</button>
        <button type="button" data-where="remote" aria-pressed="false">Remote</button>
      </div>
      <select id="level" aria-label="Level">
        <option value="">Any level</option>
        <option>Intern</option><option>Graduate</option><option>Junior</option><option>Trainee</option>
      </select>
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="pay">Highest pay</option>
      </select>
    </div>
    <div>
      <div class="label" style="margin-bottom:6px">Discipline</div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <div class="board">
    <section aria-label="Jobs">
      <div class="listhead">
        <span class="label" id="count"></span>
        <span class="row" style="gap:8px">
          <button type="button" class="chip" id="englishOnly" aria-pressed="false">English only</button>
          <button type="button" class="chip" id="savedOnly" aria-pressed="false">★ Saved only</button>
        </span>
      </div>
      <div class="list" id="list"><div class="empty">Loading jobs…</div></div>
    </section>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>

  <footer>
    <span id="updated"></span>
    <span><a href="https://www.adzuna.co.uk" target="_blank" rel="noopener">Jobs by Adzuna</a> and studio career sites</span>
  </footer>
</div>

<script>
const DISCIPLINES=["Programming","Art","Animation","Design","QA","Audio","Production","Community","Other"];
const COLOURS=["#c2410c","#1d4ed8","#7c3aed","#047857","#0369a1","#b91c1c","#6d28d9","#334155","#0f766e","#a16207"];
const $=s=>document.querySelector(s);
const state={q:"",where:"all",level:"",disc:new Set(),sort:"new",savedOnly:false,englishOnly:false,current:null};
let JOBS=[];
let saved=new Set();
try{saved=new Set(JSON.parse(localStorage.getItem("lv1-saved")||"[]"))}catch(e){}
const persist=()=>{try{localStorage.setItem("lv1-saved",JSON.stringify([...saved]))}catch(e){}};

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gbp=n=>"£"+Math.round(n).toLocaleString("en-GB");
function payText(j){
  if(!j.salaryMin&&!j.salaryMax)return "Salary not listed";
  if(!j.salaryMax||j.salaryMin===j.salaryMax)return gbp(j.salaryMin||j.salaryMax);
  if(!j.salaryMin)return "Up to "+gbp(j.salaryMax);
  return gbp(j.salaryMin)+"–"+gbp(j.salaryMax).slice(1);
}
const daysAgo=iso=>Math.max(0,Math.floor((Date.now()-new Date(iso))/864e5));
const ageText=d=>d===0?"Today":d===1?"1 day ago":d+" days ago";
const initials=n=>n.replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
const colour=n=>COLOURS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COLOURS.length];
const isEM=j=>j.region==="East Midlands";

$("#chips").innerHTML=DISCIPLINES.map(d=>`<button type="button" class="chip" data-disc="${d}" aria-pressed="false">${d}</button>`).join("");

function filtered(){
  const q=state.q.trim().toLowerCase();
  const out=JOBS.filter(j=>{
    if(state.where==="uk"&&j.remote)return false;
    if(state.where==="em"&&!isEM(j))return false;
    if(state.where==="remote"&&!j.remote)return false;
    if(state.level&&j.level!==state.level)return false;
    if(state.disc.size&&!state.disc.has(j.discipline))return false;
    if(state.savedOnly&&!saved.has(j.id))return false;
    if(state.englishOnly&&j.language)return false;
    if(q&&!(j.title+" "+j.company+" "+j.location+" "+j.discipline).toLowerCase().includes(q))return false;
    return true;
  });
  out.sort(state.sort==="pay"?(a,b)=>(b.salaryMax||b.salaryMin||0)-(a.salaryMax||a.salaryMin||0):(a,b)=>b.posted.localeCompare(a.posted));
  return out;
}

function render(){
  const jobs=filtered();
  $("#count").textContent=jobs.length===1?"1 job":jobs.length+" jobs";
  if(!JOBS.length){
    $("#list").innerHTML=`<div class="empty">No jobs yet. The job list updates every 6 hours, so check back soon.</div>`;
    $("#detail").innerHTML=`<p class="tag">Job details will appear here.</p>`;return;
  }
  if(!jobs.length){
    $("#list").innerHTML=`<div class="empty">No jobs match these filters. Try removing a discipline or switching to All.</div>`;
    $("#detail").innerHTML=`<p class="tag">Pick a job to see the details.</p>`;return;
  }
  if(!jobs.find(j=>j.id===state.current))state.current=jobs[0].id;
  $("#list").innerHTML=jobs.map(j=>{const d=daysAgo(j.posted);return `
    <div class="job" role="button" tabindex="0" data-id="${esc(j.id)}" aria-current="${j.id===state.current}">
      <div class="badge" style="background:${colour(j.company)}" aria-hidden="true">${esc(initials(j.company))}</div>
      <div>
        <h3>${esc(j.title)}</h3>
        <div class="studio">${esc(j.company)} · ${esc(j.location)}</div>
        <div class="meta">
          <span class="pill lvl">${esc(j.level)}</span>
          ${j.remote?'<span class="pill remote">Remote</span>':""}
          ${isEM(j)?'<span class="pill local">East Midlands</span>':""}
          ${j.language?'<span class="pill">Second language</span>':""}
          <span class="pill">${payText(j)}</span>
        </div>
      </div>
      <div style="display:grid;justify-items:end;gap:4px">
        <span class="age ${d<=1?"new":""}">${ageText(d)}</span>
        <button type="button" class="star" data-save="${esc(j.id)}" aria-pressed="${saved.has(j.id)}" aria-label="${saved.has(j.id)?"Remove from saved":"Save job"}">${saved.has(j.id)?"★":"☆"}</button>
      </div>
    </div>`}).join("");
  renderDetail(JOBS.find(j=>j.id===state.current));
}

function renderDetail(j){
  const s=saved.has(j.id);
  $("#detail").innerHTML=`
    <div class="row" style="gap:10px">
      <div class="badge" style="background:${colour(j.company)}" aria-hidden="true">${esc(initials(j.company))}</div>
      <div><div style="font-weight:700">${esc(j.company)}</div><div class="tag" style="font-size:14px">Posted ${ageText(daysAgo(j.posted)).toLowerCase()}</div></div>
    </div>
    <h2>${esc(j.title)}</h2>
    <dl class="facts">
      <div><dt>Level</dt><dd>${esc(j.level)}</dd></div>
      <div><dt>Location</dt><dd>${esc(j.location)}</dd></div>
      <div><dt>Work style</dt><dd>${j.remote?"Remote":"Office or hybrid"}</dd></div>
      <div><dt>Salary</dt><dd>${payText(j)}</dd></div>
    </dl>
    ${j.description?`<h4>About the role</h4><p class="desc">${esc(j.description)}</p>`:""}
    <div class="actions">
      <a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Read the full job and apply</a>
      <button type="button" class="btn ghost" data-save="${esc(j.id)}" aria-pressed="${s}">${s?"★ Saved":"☆ Save for later"}</button>
    </div>
    <p class="note">Found via ${esc(j.source)}. Always check the full advert before applying.</p>`;
}

document.addEventListener("click",e=>{
  const save=e.target.closest("[data-save]");
  if(save){e.stopPropagation();const id=save.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);persist();render();return}
  const job=e.target.closest(".job");
  if(job){state.current=job.dataset.id;render();if(innerWidth<=820)$("#detail").scrollIntoView({behavior:"smooth",block:"start"});return}
  const w=e.target.closest("[data-where]");
  if(w){state.where=w.dataset.where;document.querySelectorAll("[data-where]").forEach(b=>b.setAttribute("aria-pressed",b===w));render();return}
  const c=e.target.closest("[data-disc]");
  if(c){const d=c.dataset.disc;state.disc.has(d)?state.disc.delete(d):state.disc.add(d);c.setAttribute("aria-pressed",state.disc.has(d));render();return}
  if(e.target.id==="savedOnly"){state.savedOnly=!state.savedOnly;e.target.setAttribute("aria-pressed",state.savedOnly);render();return}
  if(e.target.id==="englishOnly"){state.englishOnly=!state.englishOnly;e.target.setAttribute("aria-pressed",state.englishOnly);render()}
});
document.addEventListener("keydown",e=>{
  const job=e.target.closest&&e.target.closest(".job");
  if(job&&(e.key==="Enter"||e.key===" ")&&!e.target.closest("[data-save]")){e.preventDefault();job.click()}
});
$("#q").addEventListener("input",e=>{state.q=e.target.value;render()});
$("#level").addEventListener("change",e=>{state.level=e.target.value;render()});
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;render()});

fetch("jobs.json",{cache:"no-store"}).then(r=>r.json()).then(data=>{
  JOBS=data.jobs||[];
  const studios=new Set(JOBS.map(j=>j.company)).size;
  if(JOBS.length)$("#total").textContent=`${JOBS.length} open roles from ${studios} employers right now.`;
  if(data.updated)$("#updated").textContent="Last updated "+new Date(data.updated).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
  render();
}).catch(()=>{
  $("#list").innerHTML=`<div class="empty">Couldn't load the job list. Refresh the page to try again.</div>`;
});
</script>
</body>
</html>
